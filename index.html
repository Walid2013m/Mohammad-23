<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة الخلاطة</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #f4f6f9;
            color: #333;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #2c3e50;
        }
        .form-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .input-box {
            display: flex;
            flex-direction: column;
        }
        .input-box label {
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        .input-box input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background-color: #219150;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 30px;
        }
        table, th, td {
            border: 1px solid #ddd;
        }
        th, td {
            padding: 12px;
            text-align: center;
        }
        th {
            background-color: #2c3e50;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .delete-btn {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
        }
        .delete-btn:hover {
            background-color: #c0392b;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>نظام إدارة طلبات الخلاطة</h1>
    
    <form id="mixerForm">
        <div class="form-group">
            <div class="input-box">
                <label for="date">التاريخ:</label>
                <input type="date" id="date" required>
            </div>
            <div class="input-box">
                <label for="customer">اسم العميل:</label>
                <input type="text" id="customer" placeholder="أدخل اسم العميل" required>
            </div>
            <div class="input-box">
                <label for="quantity">الكمية (متر مكعب):</label>
                <input type="number" id="quantity" step="0.1" placeholder="مثال: 10" required>
            </div>
            <div class="input-box">
                <label for="price">سعر المتر:</label>
                <input type="number" id="price" step="0.01" placeholder="أدخل السعر" required>
            </div>
        </div>
        <button type="submit">إضافة السجل</button>
    </form>

    <table>
        <thead>
            <tr>
                <th>التاريخ</th>
                <th>اسم العميل</th>
                <th>الكمية (م³)</th>
                <th>سعر المتر</th>
                <th>الإجمالي</th>
                <th>إجراء</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <!-- سيتم إضافة البيانات هنا تلقائياً -->
        </tbody>
    </table>
</div>

<script>
    // ضبط تاريخ اليوم تلقائياً عند الفتح
    document.getElementById('date').valueAsDate = new Date();

    const form = document.getElementById('mixerForm');
    const tableBody = document.getElementById('tableBody');

    form.addEventListener('submit', function(e) {
        e.preventDefault();

        // جلب القيم من المدخلات
        const date = document.getElementById('date').value;
        const customer = document.getElementById('customer').value;
        const quantity = parseFloat(document.getElementById('quantity').value);
        const price = parseFloat(document.getElementById('price').value);
        const total = (quantity * price).toFixed(2);

        // إنشاء صف جديد في الجدول
        const row = document.createElement('tr');
        row.innerHTML = `
            <td>${date}</td>
            <td>${customer}</td>
            <td>${quantity}</td>
            <td>${price}</td>
            <td>${total}</td>
            <td><button class="delete-btn" onclick="deleteRow(this)">حذف</button></td>
        `;

        tableBody.appendChild(row);

        // إعادة تفريغ الحقول مع الإبقاء على التاريخ
        document.getElementById('customer').value = '';
        document.getElementById('quantity').value = '';
        document.getElementById('price').value = '';
    });

    // دالة حذف الصف
    function deleteRow(button) {
        button.parentElement.parentElement.remove();
    }
</script>

</body>
</html>
